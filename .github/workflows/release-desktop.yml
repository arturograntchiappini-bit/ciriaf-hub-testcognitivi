name: release-desktop

# Si avvia con un tag `vX.Y.Z`: verifica, costruisce MSI, zip e checksum, attesta la provenienza e pubblica la Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # crea la Release
      id-token: write # attestazione di provenienza
      attestations: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: desktop
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Installa WiX
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
      - name: Test
        working-directory: desktop
        run: |
          cargo test --workspace --release --locked
          cargo check -p sintropia-engines --target wasm32-unknown-unknown --locked
      - name: Installer, zip e checksum
        # Per firmare l'MSI e l'exe imposta il segreto SINTROPIA_SIGN_COMMAND (vedi docs/sicurezza.md).
        env:
          SINTROPIA_SIGN_COMMAND: ${{ secrets.SINTROPIA_SIGN_COMMAND }}
        run: ./desktop/installer/build-installer.ps1
      - name: Attesta la provenienza degli artefatti
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist-desktop/Sintropia-Setup-x64.msi
            dist-desktop/Sintropia-Desktop-x64.zip
      - name: Pubblica la Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          files: |
            dist-desktop/Sintropia-Setup-x64.msi
            dist-desktop/Sintropia-Desktop-x64.zip
            dist-desktop/SHA256SUMS.txt
