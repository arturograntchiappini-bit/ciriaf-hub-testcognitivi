# Politica delle dipendenze Rust (cargo-deny): vulnerabilità note, licenze ammesse, fonti.
[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
unused-allowed-license = "allow"
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
    "Unicode-3.0", "MPL-2.0", "CC0-1.0", "BSL-1.0", "OFL-1.1", "LicenseRef-UFL-1.0", "Unlicense", "0BSD", "CDLA-Permissive-2.0", "Ubuntu-font-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true # i crate del workspace si referenziano per percorso

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
