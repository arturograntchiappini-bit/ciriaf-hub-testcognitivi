# Wrapper WASM del benchmark: crate standalone (workspace vuoto) fuori dal workspace principale.
[workspace]

[package]
name = "sintropia-bench-wasm"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
sintropia-core = { path = "../../../crates/core" }
sintropia-engines = { path = "../../../crates/engines" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
